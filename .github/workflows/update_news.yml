# Keeps SMCNewsHistory.json up to date automatically (Forex Factory feed).
# Runs twice a day (00:00 and 12:00 UTC) to catch the weekly calendar
# rollover and mid-week additions, and can also be triggered manually from
# the Actions tab (workflow_dispatch). Commits only when the file changed.

name: Update SMCNewsHistory

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-smcnews-history
  cancel-in-progress: false

jobs:
  update:
    name: Update SMCNewsHistory.json
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run incremental updater
        run: python update_news.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SMCNewsHistory.json
          if git diff --cached --quiet; then
            echo "No changes in SMCNewsHistory.json; skipping commit."
          else
            echo "Changes detected; committing."
            git commit -m "chore: update SMCNewsHistory.json (auto $(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
